services:
  source:
    build: .
    ports:
      - "45068:45068"
    volumes:
      - source-state:/var/lib/source
      # The Lemon's library: metadata and extracted books, under one roof.
      - type: bind
        source: /mnt/data/gutenberg
        target: /data/gutenberg
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 15s
volumes:
  source-state:
