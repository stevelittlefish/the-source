services:
  source:
    build: .
    ports:
      - "45068:45068"
    volumes:
      - type: bind
        source: /srv/the-source
        target: /var/lib/source
        bind:
          create_host_path: true
      # The Lemon's library: metadata and extracted books, under one roof.
      - type: bind
        source: /mnt/data/gutenberg
        target: /data/gutenberg
        read_only: true
        bind:
          create_host_path: false
      # The prepared lyrics database, built on the host by cmd/lyricsprep.
      # Read-only: the server only queries it. Build it before deploying.
      - type: bind
        source: /mnt/data/lyrics
        target: /data/lyrics
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 15s
