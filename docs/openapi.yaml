{
  "openapi": "3.1.0",
  "info": {
    "title": "The Source API",
    "version": "1.0.0",
    "description": "Read-only Project Gutenberg catalog, installed text, and random prose. English is the default for selection endpoints. GET and HEAD only. No authentication. Query parameters must be supplied once. Browse and random endpoints reject unknown query parameters. Random responses use Cache-Control: no-store. HTML UI routes are not API endpoints. This document uses JSON syntax, which is valid YAML 1.2."
  },
  "servers": [
    {
      "url": "/",
      "description": "Same server as this specification (default port 45068)"
    }
  ],
  "security": [],
  "paths": {
    "/health": {
      "get": {
        "operationId": "getHealth",
        "summary": "Service health",
        "description": "Returns ok once the service has loaded its catalog. Does not test every corpus file.",
        "parameters": [],
        "responses": {
          "200": {
            "description": "Service is running.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "status"
                  ],
                  "properties": {
                    "status": {
                      "type": "string",
                      "const": "ok"
                    }
                  }
                }
              }
            }
          },
          "405": {
            "$ref": "#/components/responses/Method"
          }
        }
      },
      "head": {
        "operationId": "getHealthHead",
        "summary": "Service health (headers only)",
        "description": "Same selection/validation as GET; no response body. Returns ok once the service has loaded its catalog. Does not test every corpus file.",
        "parameters": [],
        "responses": {
          "200": {
            "description": "Service is running."
          },
          "405": {
            "description": "405 method_not_allowed. Allow: GET, HEAD."
          }
        }
      }
    },
    "/api/v1/books": {
      "get": {
        "operationId": "listBooks",
        "summary": "Browse and search metadata",
        "description": "Text records only. Case-insensitive title order, then ID. Every whitespace-separated query word must occur as a substring in title, authors, subjects or bookshelves; no text-content search. Empty results return 200. Numeric offset cursors are not snapshots; a catalog refresh can change pages.",
        "parameters": [
          {
            "$ref": "#/components/parameters/language"
          },
          {
            "name": "q",
            "in": "query",
            "schema": {
              "type": "string"
            },
            "description": "Metadata search; maximum 256 UTF-8 bytes.",
            "example": "austen"
          },
          {
            "name": "available",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "true",
                "false"
              ]
            },
            "description": "true selects installed texts; false selects absent texts; omission selects both. Blank invalid."
          },
          {
            "name": "limit",
            "in": "query",
            "schema": {
              "type": "integer",
              "default": 25,
              "minimum": 1,
              "maximum": 100
            }
          },
          {
            "name": "cursor",
            "in": "query",
            "schema": {
              "type": "string",
              "pattern": "^[0-9]+$"
            },
            "description": "Nonnegative offset returned as next_cursor. Omit for first page."
          }
        ],
        "responses": {
          "200": {
            "description": "Matching catalog records; original publication year is not populated here.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/BookPage"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Invalid"
          },
          "405": {
            "$ref": "#/components/responses/Method"
          }
        }
      },
      "head": {
        "operationId": "listBooksHead",
        "summary": "Browse and search metadata (headers only)",
        "description": "Same selection/validation as GET; no response body. Text records only. Case-insensitive title order, then ID. Every whitespace-separated query word must occur as a substring in title, authors, subjects or bookshelves; no text-content search. Empty results return 200. Numeric offset cursors are not snapshots; a catalog refresh can change pages.",
        "parameters": [
          {
            "$ref": "#/components/parameters/language"
          },
          {
            "name": "q",
            "in": "query",
            "schema": {
              "type": "string"
            },
            "description": "Metadata search; maximum 256 UTF-8 bytes.",
            "example": "austen"
          },
          {
            "name": "available",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "true",
                "false"
              ]
            },
            "description": "true selects installed texts; false selects absent texts; omission selects both. Blank invalid."
          },
          {
            "name": "limit",
            "in": "query",
            "schema": {
              "type": "integer",
              "default": 25,
              "minimum": 1,
              "maximum": 100
            }
          },
          {
            "name": "cursor",
            "in": "query",
            "schema": {
              "type": "string",
              "pattern": "^[0-9]+$"
            },
            "description": "Nonnegative offset returned as next_cursor. Omit for first page."
          }
        ],
        "responses": {
          "200": {
            "description": "Matching catalog records; original publication year is not populated here."
          },
          "400": {
            "description": "400 invalid_query: invalid, unknown or repeated selection parameter; invalid range."
          },
          "405": {
            "description": "405 method_not_allowed. Allow: GET, HEAD."
          }
        }
      }
    },
    "/api/v1/books/{id}": {
      "get": {
        "operationId": "getBook",
        "summary": "Get book metadata",
        "description": "Retrieves the requested ID regardless of language or catalog type. Not subject to selection filters. Known publication year is enriched from the installed file header.",
        "parameters": [
          {
            "$ref": "#/components/parameters/id"
          }
        ],
        "responses": {
          "200": {
            "description": "Book record.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AvailableBook"
                }
              }
            }
          },
          "404": {
            "$ref": "#/components/responses/Missing"
          },
          "405": {
            "$ref": "#/components/responses/Method"
          }
        }
      },
      "head": {
        "operationId": "getBookHead",
        "summary": "Get book metadata (headers only)",
        "description": "Same selection/validation as GET; no response body. Retrieves the requested ID regardless of language or catalog type. Not subject to selection filters. Known publication year is enriched from the installed file header.",
        "parameters": [
          {
            "$ref": "#/components/parameters/id"
          }
        ],
        "responses": {
          "200": {
            "description": "Book record."
          },
          "404": {
            "description": "404: book_not_found for unknown IDs; text_unavailable for absent text; no_matching_books for empty random selection; not_found for unknown API routes."
          },
          "405": {
            "description": "405 method_not_allowed. Allow: GET, HEAD."
          }
        }
      }
    },
    "/api/v1/books/{id}/text": {
      "get": {
        "operationId": "getBookText",
        "summary": "Stream original book text",
        "description": "UTF-8 plain text, unchanged: includes Gutenberg wrapper and front matter. Supports byte ranges and conditional requests via Last-Modified. A multi-range request may return multipart/byteranges. No server-side attachment disposition; clients choose download filename.",
        "parameters": [
          {
            "$ref": "#/components/parameters/id"
          },
          {
            "name": "Range",
            "in": "header",
            "schema": {
              "type": "string"
            },
            "example": "bytes=0-65535"
          },
          {
            "name": "If-Modified-Since",
            "in": "header",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "If-Unmodified-Since",
            "in": "header",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "If-Range",
            "in": "header",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Full book text.",
            "content": {
              "text/plain": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "206": {
            "description": "Requested byte range(s); Content-Range for single range.",
            "content": {
              "text/plain": {
                "schema": {
                  "type": "string"
                }
              },
              "multipart/byteranges": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "304": {
            "description": "Not modified; no body."
          },
          "404": {
            "$ref": "#/components/responses/Missing"
          },
          "405": {
            "$ref": "#/components/responses/Method"
          },
          "412": {
            "description": "Precondition failed; no body."
          },
          "416": {
            "description": "Invalid or unsatisfiable Range; standard HTTP plain-text error, NOT JSON.",
            "content": {
              "text/plain": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "500": {
            "$ref": "#/components/responses/TextError"
          }
        }
      },
      "head": {
        "operationId": "getBookTextHead",
        "summary": "Stream original book text (headers only)",
        "description": "Same selection/validation as GET; no response body. UTF-8 plain text, unchanged: includes Gutenberg wrapper and front matter. Supports byte ranges and conditional requests via Last-Modified. A multi-range request may return multipart/byteranges. No server-side attachment disposition; clients choose download filename.",
        "parameters": [
          {
            "$ref": "#/components/parameters/id"
          },
          {
            "name": "Range",
            "in": "header",
            "schema": {
              "type": "string"
            },
            "example": "bytes=0-65535"
          },
          {
            "name": "If-Modified-Since",
            "in": "header",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "If-Unmodified-Since",
            "in": "header",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "If-Range",
            "in": "header",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Full book text."
          },
          "206": {
            "description": "Requested byte range(s); Content-Range for single range."
          },
          "304": {
            "description": "Not modified; no body."
          },
          "404": {
            "description": "404: book_not_found for unknown IDs; text_unavailable for absent text; no_matching_books for empty random selection; not_found for unknown API routes."
          },
          "405": {
            "description": "405 method_not_allowed. Allow: GET, HEAD."
          },
          "412": {
            "description": "Precondition failed; no body."
          },
          "416": {
            "description": "Invalid or unsatisfiable Range; standard HTTP plain-text error, NOT JSON."
          },
          "500": {
            "description": "500 text_error: installed file could not be opened."
          }
        }
      }
    },
    "/api/v1/languages": {
      "get": {
        "operationId": "listLanguages",
        "summary": "List catalog languages",
        "description": "Sorted distinct language codes for Text records, including languages without installed texts. Discovery is not limited to English.",
        "parameters": [],
        "responses": {
          "200": {
            "description": "Language codes.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "languages"
                  ],
                  "properties": {
                    "languages": {
                      "type": "array",
                      "items": {
                        "type": "string"
                      },
                      "example": [
                        "en",
                        "fr"
                      ]
                    }
                  }
                }
              }
            }
          },
          "405": {
            "$ref": "#/components/responses/Method"
          }
        }
      },
      "head": {
        "operationId": "listLanguagesHead",
        "summary": "List catalog languages (headers only)",
        "description": "Same selection/validation as GET; no response body. Sorted distinct language codes for Text records, including languages without installed texts. Discovery is not limited to English.",
        "parameters": [],
        "responses": {
          "200": {
            "description": "Language codes."
          },
          "405": {
            "description": "405 method_not_allowed. Allow: GET, HEAD."
          }
        }
      }
    },
    "/api/v1/books/random": {
      "get": {
        "operationId": "randomBook",
        "summary": "Pick a random installed book",
        "description": "Uniform among installed Text records matching language and optional publication-year bounds. Returns metadata, not book contents. Repeats are allowed. Years are indexed before serving requests and persisted across restarts. Selection uses sorted in-memory indexes with no request-time header I/O. Availability is a startup snapshot.",
        "parameters": [
          {
            "$ref": "#/components/parameters/language"
          },
          {
            "$ref": "#/components/parameters/year_from"
          },
          {
            "$ref": "#/components/parameters/year_to"
          }
        ],
        "responses": {
          "200": {
            "description": "Chosen book; available is true.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AvailableBook"
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Invalid"
          },
          "404": {
            "$ref": "#/components/responses/Missing"
          },
          "405": {
            "$ref": "#/components/responses/Method"
          }
        }
      },
      "head": {
        "operationId": "randomBookHead",
        "summary": "Pick a random installed book (headers only)",
        "description": "Same selection/validation as GET; no response body. Uniform among installed Text records matching language and optional publication-year bounds. Returns metadata, not book contents. Repeats are allowed. Years are indexed before serving requests and persisted across restarts. Selection uses sorted in-memory indexes with no request-time header I/O. Availability is a startup snapshot.",
        "parameters": [
          {
            "$ref": "#/components/parameters/language"
          },
          {
            "$ref": "#/components/parameters/year_from"
          },
          {
            "$ref": "#/components/parameters/year_to"
          }
        ],
        "responses": {
          "200": {
            "description": "Chosen book; available is true.",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              }
            }
          },
          "400": {
            "description": "400 invalid_query: invalid, unknown or repeated selection parameter; invalid range."
          },
          "404": {
            "description": "404: book_not_found for unknown IDs; text_unavailable for absent text; no_matching_books for empty random selection; not_found for unknown API routes."
          },
          "405": {
            "description": "405 method_not_allowed. Allow: GET, HEAD."
          }
        }
      }
    },
    "/api/v1/excerpts/random": {
      "get": {
        "operationId": "randomExcerpt",
        "summary": "Get complete prose paragraphs from a random book",
        "description": "Tries at most eight shuffled installed matching Text records, scanning at most 8 MiB per book. Requires Gutenberg START/END markers. Heuristically rejects front matter/headings; requires at least 12 whitespace-separated words, punctuation and predominantly lowercase letters per paragraph. Does not cross rejected paragraphs. Chooses uniformly among eligible paragraph windows within a successful book, not globally across the corpus. May reject dialogue, poetry and uncased scripts; may retain unusual prose-like front matter. Lines/paragraphs over 64 KiB are rejected. Never modifies raw downloads.",
        "parameters": [
          {
            "$ref": "#/components/parameters/language"
          },
          {
            "$ref": "#/components/parameters/year_from"
          },
          {
            "$ref": "#/components/parameters/year_to"
          },
          {
            "name": "paragraphs",
            "in": "query",
            "schema": {
              "type": "integer",
              "default": 3,
              "minimum": 1,
              "maximum": 10
            },
            "description": "Exact paragraph count, not a word count."
          }
        ],
        "responses": {
          "200": {
            "description": "Excerpt with source metadata (book has no available field).",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Excerpt"
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Invalid"
          },
          "404": {
            "$ref": "#/components/responses/Missing"
          },
          "405": {
            "$ref": "#/components/responses/Method"
          },
          "422": {
            "$ref": "#/components/responses/NoExcerpt"
          }
        }
      },
      "head": {
        "operationId": "randomExcerptHead",
        "summary": "Get complete prose paragraphs from a random book (headers only)",
        "description": "Same selection/validation as GET; no response body. Tries at most eight shuffled installed matching Text records, scanning at most 8 MiB per book. Requires Gutenberg START/END markers. Heuristically rejects front matter/headings; requires at least 12 whitespace-separated words, punctuation and predominantly lowercase letters per paragraph. Does not cross rejected paragraphs. Chooses uniformly among eligible paragraph windows within a successful book, not globally across the corpus. May reject dialogue, poetry and uncased scripts; may retain unusual prose-like front matter. Lines/paragraphs over 64 KiB are rejected. Never modifies raw downloads.",
        "parameters": [
          {
            "$ref": "#/components/parameters/language"
          },
          {
            "$ref": "#/components/parameters/year_from"
          },
          {
            "$ref": "#/components/parameters/year_to"
          },
          {
            "name": "paragraphs",
            "in": "query",
            "schema": {
              "type": "integer",
              "default": 3,
              "minimum": 1,
              "maximum": 10
            },
            "description": "Exact paragraph count, not a word count."
          }
        ],
        "responses": {
          "200": {
            "description": "Excerpt with source metadata (book has no available field).",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              }
            }
          },
          "400": {
            "description": "400 invalid_query: invalid, unknown or repeated selection parameter; invalid range."
          },
          "404": {
            "description": "404: book_not_found for unknown IDs; text_unavailable for absent text; no_matching_books for empty random selection; not_found for unknown API routes."
          },
          "405": {
            "description": "405 method_not_allowed. Allow: GET, HEAD."
          },
          "422": {
            "description": "422 no_suitable_excerpt: the bounded random sample did not yield enough qualifying paragraphs. Does not mean the whole corpus lacks prose."
          }
        }
      }
    }
  },
  "components": {
    "parameters": {
      "language": {
        "name": "language",
        "in": "query",
        "description": "Defaults to English, including multilingual records containing en. Explicit all removes the filter. Blank is invalid. Trimmed and case-insensitive.",
        "schema": {
          "type": "string",
          "minLength": 1,
          "default": "en"
        },
        "examples": {
          "english": {
            "value": "en"
          },
          "all": {
            "value": "all"
          },
          "french": {
            "value": "fr"
          }
        }
      },
      "year_from": {
        "name": "year_from",
        "in": "query",
        "description": "Inclusive original publication year lower bound. Unknown years excluded when either bound is set. Use 1901 for after 1900. Must not exceed year_to.",
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 9999
        },
        "example": 1901
      },
      "year_to": {
        "name": "year_to",
        "in": "query",
        "description": "Inclusive original publication year upper bound; not Gutenberg release year.",
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 9999
        },
        "example": 1950
      },
      "id": {
        "name": "id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "integer",
          "minimum": 1
        },
        "example": 1342
      }
    },
    "schemas": {
      "Book": {
        "type": "object",
        "required": [
          "id",
          "type",
          "issued",
          "title",
          "languages",
          "authors",
          "subjects",
          "locc",
          "bookshelves"
        ],
        "properties": {
          "id": {
            "type": "integer",
            "minimum": 1,
            "example": 1342
          },
          "type": {
            "type": "string",
            "example": "Text"
          },
          "issued": {
            "type": "string",
            "description": "Gutenberg release date, NOT original publication year.",
            "example": "1998-06-01"
          },
          "title": {
            "type": "string",
            "example": "Pride and Prejudice"
          },
          "languages": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "example": [
              "en"
            ]
          },
          "authors": {
            "type": "string",
            "description": "Catalog display string; may contain multiple authors and dates.",
            "example": "Austen, Jane, 1775-1817"
          },
          "subjects": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "locc": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "bookshelves": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "original_publication_year": {
            "type": "integer",
            "minimum": 1,
            "maximum": 9999,
            "description": "Only an unambiguous four-digit year from the Original publication header. Omitted when unknown, and not populated in browse results."
          }
        }
      },
      "AvailableBook": {
        "allOf": [
          {
            "$ref": "#/components/schemas/Book"
          },
          {
            "type": "object",
            "required": [
              "available"
            ],
            "properties": {
              "available": {
                "type": "boolean",
                "description": "Presence in the startup corpus index; restart after corpus changes."
              }
            }
          }
        ]
      },
      "BookPage": {
        "type": "object",
        "required": [
          "books",
          "total",
          "next_cursor"
        ],
        "properties": {
          "books": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/AvailableBook"
            }
          },
          "total": {
            "type": "integer",
            "minimum": 0
          },
          "next_cursor": {
            "type": "string",
            "pattern": "^[0-9]*$",
            "description": "Empty means no next page. Otherwise pass unchanged with the same filters and limit."
          }
        }
      },
      "Excerpt": {
        "type": "object",
        "required": [
          "book",
          "paragraphs"
        ],
        "properties": {
          "book": {
            "$ref": "#/components/schemas/Book"
          },
          "paragraphs": {
            "type": "array",
            "minItems": 1,
            "maxItems": 10,
            "items": {
              "type": "string"
            },
            "description": "Exactly the requested count of complete consecutive qualifying prose paragraphs. Wrapped lines normalized to spaces."
          }
        }
      },
      "Error": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "object",
            "required": [
              "code",
              "message"
            ],
            "properties": {
              "code": {
                "type": "string"
              },
              "message": {
                "type": "string"
              }
            }
          }
        }
      }
    },
    "responses": {
      "Invalid": {
        "description": "400 invalid_query: invalid, unknown or repeated selection parameter; invalid range.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "Missing": {
        "description": "404: book_not_found for unknown IDs; text_unavailable for absent text; no_matching_books for empty random selection; not_found for unknown API routes.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "Method": {
        "description": "405 method_not_allowed. Allow: GET, HEAD.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "NoExcerpt": {
