  },
  "components": {
    "parameters": {
      "language": {
        "name": "language",
        "in": "query",
        "description": "Defaults to English, including multilingual records containing en. Explicit all removes the filter. Blank is invalid. Trimmed and case-insensitive.",
        "schema": {
          "type": "string",
          "minLength": 1,
          "default": "en"
        },
        "examples": {
          "english": {
            "value": "en"
          },
          "all": {
            "value": "all"
          },
          "french": {
            "value": "fr"
          }
        }
      },
      "year_from": {
        "name": "year_from",
        "in": "query",
        "description": "Inclusive original publication year lower bound. Unknown years excluded when either bound is set. Use 1901 for after 1900. Must not exceed year_to.",
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 9999
        },
        "example": 1901
      },
      "year_to": {
        "name": "year_to",
        "in": "query",
        "description": "Inclusive original publication year upper bound; not Gutenberg release year.",
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 9999
        },
        "example": 1950
      },
      "id": {
        "name": "id",
        "in": "path",
        "required": true,
        "schema": {
          "type": "integer",
          "minimum": 1
        },
        "example": 1342
      },
      "songLanguage": {
        "name": "language",
        "in": "query",
        "description": "Optional language filter for songs. Unlike books, there is no English default: omission or all removes the filter. Trimmed and case-insensitive.",
        "schema": {"type": "string", "minLength": 1},
        "examples": {"english": {"value": "en"}, "all": {"value": "all"}}
      },
      "tag": {
        "name": "tag",
        "in": "query",
        "description": "Optional genre filter (e.g. rap, pop, rock, rb, country, misc). Trimmed and case-insensitive.",
        "schema": {"type": "string", "minLength": 1},
        "example": "rap"
      },
      "songId": {
        "name": "id",
        "in": "path",
        "required": true,
        "schema": {"type": "integer", "minimum": 1},
        "example": 10
      },
      "views_from": {
        "name": "views_from",
        "in": "query",
        "description": "Inclusive lower bound on view count. Omit or 0 for no lower bound. Must not exceed views_to.",
        "schema": {"type": "integer", "minimum": 0},
        "example": 1000
      },
      "views_to": {
        "name": "views_to",
        "in": "query",
        "description": "Inclusive upper bound on view count. Omit or 0 for no upper bound.",
        "schema": {"type": "integer", "minimum": 0},
        "example": 100000
      }
    },
    "schemas": {
      "Book": {
        "type": "object",
        "required": [
          "id",
          "type",
          "issued",
          "title",
          "languages",
          "authors",
          "subjects",
          "locc",
          "bookshelves"
        ],
        "properties": {
          "id": {
            "type": "integer",
            "minimum": 1,
            "example": 1342
          },
          "type": {
            "type": "string",
            "example": "Text"
          },
          "issued": {
            "type": "string",
            "description": "Gutenberg release date, NOT original publication year.",
            "example": "1998-06-01"
          },
          "title": {
            "type": "string",
            "example": "Pride and Prejudice"
          },
          "languages": {
            "type": "array",
            "items": {
              "type": "string"
            },
            "example": [
              "en"
            ]
          },
          "authors": {
            "type": "string",
            "description": "Catalog display string; may contain multiple authors and dates.",
            "example": "Austen, Jane, 1775-1817"
          },
          "subjects": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "locc": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "bookshelves": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "original_publication_year": {
            "type": "integer",
            "minimum": 1,
            "maximum": 9999,
            "description": "Only an unambiguous four-digit year from the Original publication header. Omitted when unknown, and not populated in browse results."
          }
        }
      },
      "AvailableBook": {
        "allOf": [
          {
            "$ref": "#/components/schemas/Book"
          },
          {
            "type": "object",
            "required": [
              "available"
            ],
            "properties": {
              "available": {
                "type": "boolean",
                "description": "Presence in the startup corpus index; restart after corpus changes."
              }
            }
          }
        ]
      },
      "BookPage": {
        "type": "object",
        "required": [
          "books",
          "total",
          "next_cursor"
        ],
        "properties": {
          "books": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/AvailableBook"
            }
          },
          "total": {
            "type": "integer",
            "minimum": 0
          },
          "next_cursor": {
            "type": "string",
            "pattern": "^[0-9]*$",
            "description": "Empty means no next page. Otherwise pass unchanged with the same filters and limit."
          }
        }
      },
      "Excerpt": {
        "type": "object",
        "required": [
          "book",
          "paragraphs"
        ],
        "properties": {
          "book": {
            "$ref": "#/components/schemas/Book"
          },
          "paragraphs": {
            "type": "array",
            "minItems": 1,
            "maxItems": 10,
            "items": {
              "type": "string"
            },
            "description": "Exactly the requested count of complete consecutive qualifying prose paragraphs. Wrapped lines normalized to spaces."
          }
        }
      },
      "Song": {
        "type": "object",
        "required": ["id", "title", "artist", "views"],
        "properties": {
          "id": {"type": "integer", "minimum": 1, "example": 10},
          "title": {"type": "string", "example": "Killa Cam"},
          "artist": {"type": "string", "example": "Cam'ron"},
          "tag": {"type": "string", "description": "Genre tag. Omitted when unknown.", "example": "rap"},
          "language": {"type": "string", "description": "Language code. Omitted when unknown.", "example": "en"},
          "year": {"type": "integer", "description": "Release year; only plausible values are kept, junk is omitted.", "example": 2004},
          "views": {"type": "integer", "minimum": 0, "description": "Genius view count; useful as a popularity signal."},
          "features": {"type": "array", "items": {"type": "string"}, "description": "Featured artists, parsed from the source array. Omitted when none."},
          "lyrics": {"type": "string", "description": "Lyrics body. Present only where explicitly documented; omitted from listings, item metadata, random and excerpt responses."}
        }
      },
      "SongPage": {
        "type": "object",
        "required": ["songs", "total", "next_cursor"],
        "properties": {
          "songs": {"type": "array", "items": {"$ref": "#/components/schemas/Song"}},
          "total": {"type": "integer", "minimum": 0},
          "next_cursor": {"type": "string", "pattern": "^[0-9]*$", "description": "Empty means no next page. Otherwise pass unchanged with the same filters and limit."}
        }
      },
      "LyricsExcerpt": {
        "type": "object",
        "required": ["song", "lines"],
        "properties": {
          "song": {"$ref": "#/components/schemas/Song"},
          "lines": {"type": "array", "minItems": 2, "items": {"type": "string"}, "description": "The lines of one stanza, section markers removed."}
        }
      },
      "Error": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "object",
            "required": [
              "code",
              "message"
            ],
            "properties": {
              "code": {
                "type": "string"
              },
              "message": {
                "type": "string"
              }
            }
          }
        }
      }
    },
    "responses": {
      "Invalid": {
        "description": "400 invalid_query: invalid, unknown or repeated selection parameter; invalid range.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "Missing": {
        "description": "404: book_not_found for unknown IDs; text_unavailable for absent text; no_matching_books for empty random selection; not_found for unknown API routes.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "Method": {
        "description": "405 method_not_allowed. Allow: GET, HEAD.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "NoExcerpt": {
        "description": "422 no_suitable_excerpt: the bounded random sample did not yield enough qualifying paragraphs. Does not mean the whole corpus lacks prose.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "TextError": {
        "description": "500 text_error: installed file could not be opened.",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/Error"
            }
          }
        }
      },
      "LyricsMissing": {
        "description": "404: song_not_found for unknown song ids; no_matching_songs for empty random selection; lyrics_unavailable when no lyrics corpus is installed.",
        "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}
      },
      "LyricsError": {
        "description": "500 lyrics_error: the lyrics database could not be queried.",
        "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}
      },
      "NoStanza": {
        "description": "422 no_suitable_excerpt: the sampled songs yielded no qualifying stanza. Does not mean the whole corpus lacks stanzas.",
        "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}
      }
    }
  }
}
