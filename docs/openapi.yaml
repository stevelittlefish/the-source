{
  "openapi": "3.1.0",
  "info": {
    "title": "The Source API",
    "version": "1.0.0",
    "description": "Read-only Project Gutenberg catalog, installed text, and random prose. English is the default for selection endpoints. GET and HEAD only. No authentication. Query parameters must be supplied once. Browse and random endpoints reject unknown query parameters. Random responses use Cache-Control: no-store. HTML UI routes are not API endpoints. This document uses JSON syntax, which is valid YAML 1.2."
  },
  "servers": [
    {
      "url": "/",
      "description": "Same server as this specification (default port 45068)"
    }
  ],
  "security": [],
  "paths": {
    "/health": {
      "get": {
        "operationId": "getHealth",
        "summary": "Service health",
        "description": "Returns ok once the service has loaded its catalog. Does not test every corpus file.",
        "parameters": [],
        "responses": {
          "200": {
            "description": "Service is running.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "status"
                  ],
                  "properties": {
                    "status": {
                      "type": "string",
                      "const": "ok"
                    }
                  }
                }
              }
            }
          },
          "405": {
            "$ref": "#/components/responses/Method"
          }
        }
      },
      "head": {
        "operationId": "getHealthHead",
        "summary": "Service health (headers only)",
        "description": "Same selection/validation as GET; no response body. Returns ok once the service has loaded its catalog. Does not test every corpus file.",
        "parameters": [],
        "responses": {
          "200": {
            "description": "Service is running."
          },
          "405": {
            "description": "405 method_not_allowed. Allow: GET, HEAD."
          }
        }
      }
    },
    "/api/v1/books": {
      "get": {
        "operationId": "listBooks",
        "summary": "Browse and search metadata",
        "description": "Text records only. Case-insensitive title order, then ID. Every whitespace-separated query word must occur as a substring in title, authors, subjects or bookshelves; no text-content search. Empty results return 200. Numeric offset cursors are not snapshots; a catalog refresh can change pages.",
        "parameters": [
          {
            "$ref": "#/components/parameters/language"
          },
          {
            "name": "q",
            "in": "query",
            "schema": {
              "type": "string"
            },
            "description": "Metadata search; maximum 256 UTF-8 bytes.",
            "example": "austen"
          },
          {
            "name": "available",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "true",
                "false"
              ]
            },
            "description": "true selects installed texts; false selects absent texts; omission selects both. Blank invalid."
          },
          {
            "name": "limit",
            "in": "query",
            "schema": {
              "type": "integer",
              "default": 25,
              "minimum": 1,
              "maximum": 100
            }
          },
          {
            "name": "cursor",
            "in": "query",
            "schema": {
              "type": "string",
              "pattern": "^[0-9]+$"
            },
            "description": "Nonnegative offset returned as next_cursor. Omit for first page."
          }
        ],
        "responses": {
          "200": {
            "description": "Matching catalog records; original publication year is not populated here.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/BookPage"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Invalid"
          },
          "405": {
            "$ref": "#/components/responses/Method"
          }
        }
      },
      "head": {
        "operationId": "listBooksHead",
        "summary": "Browse and search metadata (headers only)",
        "description": "Same selection/validation as GET; no response body. Text records only. Case-insensitive title order, then ID. Every whitespace-separated query word must occur as a substring in title, authors, subjects or bookshelves; no text-content search. Empty results return 200. Numeric offset cursors are not snapshots; a catalog refresh can change pages.",
        "parameters": [
          {
            "$ref": "#/components/parameters/language"
          },
          {
            "name": "q",
            "in": "query",
            "schema": {
              "type": "string"
            },
            "description": "Metadata search; maximum 256 UTF-8 bytes.",
            "example": "austen"
          },
          {
            "name": "available",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "true",
                "false"
              ]
            },
            "description": "true selects installed texts; false selects absent texts; omission selects both. Blank invalid."
          },
          {
            "name": "limit",
            "in": "query",
            "schema": {
              "type": "integer",
              "default": 25,
              "minimum": 1,
              "maximum": 100
            }
          },
          {
            "name": "cursor",
            "in": "query",
            "schema": {
              "type": "string",
              "pattern": "^[0-9]+$"
            },
            "description": "Nonnegative offset returned as next_cursor. Omit for first page."
          }
        ],
        "responses": {
          "200": {
            "description": "Matching catalog records; original publication year is not populated here."
          },
          "400": {
            "description": "400 invalid_query: invalid, unknown or repeated selection parameter; invalid range."
          },
          "405": {
            "description": "405 method_not_allowed. Allow: GET, HEAD."
          }
        }
      }
    },
    "/api/v1/books/{id}": {
      "get": {
        "operationId": "getBook",
        "summary": "Get book metadata",
        "description": "Retrieves the requested ID regardless of language or catalog type. Not subject to selection filters. Known publication year is enriched from the installed file header.",
        "parameters": [
          {
            "$ref": "#/components/parameters/id"
          }
        ],
        "responses": {
          "200": {
            "description": "Book record.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AvailableBook"
                }
              }
            }
          },
          "404": {
            "$ref": "#/components/responses/Missing"
          },
          "405": {
            "$ref": "#/components/responses/Method"
          }
        }
      },
      "head": {
        "operationId": "getBookHead",
        "summary": "Get book metadata (headers only)",
        "description": "Same selection/validation as GET; no response body. Retrieves the requested ID regardless of language or catalog type. Not subject to selection filters. Known publication year is enriched from the installed file header.",
        "parameters": [
          {
            "$ref": "#/components/parameters/id"
          }
        ],
        "responses": {
          "200": {
            "description": "Book record."
          },
          "404": {
            "description": "404: book_not_found for unknown IDs; text_unavailable for absent text; no_matching_books for empty random selection; not_found for unknown API routes."
          },
          "405": {
            "description": "405 method_not_allowed. Allow: GET, HEAD."
          }
        }
      }
    },
    "/api/v1/books/{id}/text": {
      "get": {
        "operationId": "getBookText",
        "summary": "Stream original book text",
        "description": "UTF-8 plain text, unchanged: includes Gutenberg wrapper and front matter. Supports byte ranges and conditional requests via Last-Modified. A multi-range request may return multipart/byteranges. No server-side attachment disposition; clients choose download filename.",
        "parameters": [
          {
            "$ref": "#/components/parameters/id"
          },
          {
            "name": "Range",
            "in": "header",
            "schema": {
              "type": "string"
            },
            "example": "bytes=0-65535"
          },
          {
            "name": "If-Modified-Since",
            "in": "header",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "If-Unmodified-Since",
            "in": "header",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "If-Range",
            "in": "header",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Full book text.",
            "content": {
              "text/plain": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "206": {
            "description": "Requested byte range(s); Content-Range for single range.",
            "content": {
              "text/plain": {
                "schema": {
                  "type": "string"
                }
              },
              "multipart/byteranges": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "304": {
            "description": "Not modified; no body."
          },
          "404": {
            "$ref": "#/components/responses/Missing"
          },
          "405": {
            "$ref": "#/components/responses/Method"
          },
          "412": {
            "description": "Precondition failed; no body."
          },
          "416": {
            "description": "Invalid or unsatisfiable Range; standard HTTP plain-text error, NOT JSON.",
            "content": {
              "text/plain": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "500": {
            "$ref": "#/components/responses/TextError"
          }
        }
      },
      "head": {
        "operationId": "getBookTextHead",
        "summary": "Stream original book text (headers only)",
        "description": "Same selection/validation as GET; no response body. UTF-8 plain text, unchanged: includes Gutenberg wrapper and front matter. Supports byte ranges and conditional requests via Last-Modified. A multi-range request may return multipart/byteranges. No server-side attachment disposition; clients choose download filename.",
        "parameters": [
          {
            "$ref": "#/components/parameters/id"
          },
          {
            "name": "Range",
            "in": "header",
            "schema": {
              "type": "string"
            },
            "example": "bytes=0-65535"
          },
          {
            "name": "If-Modified-Since",
            "in": "header",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "If-Unmodified-Since",
            "in": "header",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "If-Range",
            "in": "header",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Full book text."
          },
          "206": {
            "description": "Requested byte range(s); Content-Range for single range."
          },
          "304": {
            "description": "Not modified; no body."
          },
          "404": {
            "description": "404: book_not_found for unknown IDs; text_unavailable for absent text; no_matching_books for empty random selection; not_found for unknown API routes."
          },
          "405": {
            "description": "405 method_not_allowed. Allow: GET, HEAD."
          },
          "412": {
            "description": "Precondition failed; no body."
          },
          "416": {
            "description": "Invalid or unsatisfiable Range; standard HTTP plain-text error, NOT JSON."
          },
          "500": {
            "description": "500 text_error: installed file could not be opened."
          }
        }
      }
    },
    "/api/v1/books/languages": {
      "get": {
        "operationId": "listLanguages",
        "summary": "List catalog languages",
        "description": "Sorted distinct language codes for Text records, including languages without installed texts. Discovery is not limited to English.",
        "parameters": [],
        "responses": {
          "200": {
            "description": "Language codes.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "required": [
                    "languages"
                  ],
                  "properties": {
                    "languages": {
                      "type": "array",
                      "items": {
                        "type": "string"
                      },
                      "example": [
                        "en",
                        "fr"
                      ]
                    }
                  }
                }
              }
            }
          },
          "405": {
            "$ref": "#/components/responses/Method"
          }
        }
      },
      "head": {
        "operationId": "listLanguagesHead",
        "summary": "List catalog languages (headers only)",
        "description": "Same selection/validation as GET; no response body. Sorted distinct language codes for Text records, including languages without installed texts. Discovery is not limited to English.",
        "parameters": [],
        "responses": {
          "200": {
            "description": "Language codes."
          },
          "405": {
            "description": "405 method_not_allowed. Allow: GET, HEAD."
          }
        }
      }
    },
    "/api/v1/books/random": {
      "get": {
        "operationId": "randomBook",
        "summary": "Pick a random installed book",
        "description": "Uniform among installed Text records matching language and optional publication-year bounds. Returns metadata, not book contents. Repeats are allowed. Years are indexed before serving requests and persisted across restarts. Selection uses sorted in-memory indexes with no request-time header I/O. Availability is a startup snapshot.",
        "parameters": [
          {
            "$ref": "#/components/parameters/language"
          },
          {
            "$ref": "#/components/parameters/year_from"
          },
          {
            "$ref": "#/components/parameters/year_to"
          }
        ],
        "responses": {
          "200": {
            "description": "Chosen book; available is true.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AvailableBook"
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Invalid"
          },
          "404": {
            "$ref": "#/components/responses/Missing"
          },
          "405": {
            "$ref": "#/components/responses/Method"
          }
        }
      },
      "head": {
        "operationId": "randomBookHead",
        "summary": "Pick a random installed book (headers only)",
        "description": "Same selection/validation as GET; no response body. Uniform among installed Text records matching language and optional publication-year bounds. Returns metadata, not book contents. Repeats are allowed. Years are indexed before serving requests and persisted across restarts. Selection uses sorted in-memory indexes with no request-time header I/O. Availability is a startup snapshot.",
        "parameters": [
          {
            "$ref": "#/components/parameters/language"
          },
          {
            "$ref": "#/components/parameters/year_from"
          },
          {
            "$ref": "#/components/parameters/year_to"
          }
        ],
        "responses": {
          "200": {
            "description": "Chosen book; available is true.",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              }
            }
          },
          "400": {
            "description": "400 invalid_query: invalid, unknown or repeated selection parameter; invalid range."
          },
          "404": {
            "description": "404: book_not_found for unknown IDs; text_unavailable for absent text; no_matching_books for empty random selection; not_found for unknown API routes."
          },
          "405": {
            "description": "405 method_not_allowed. Allow: GET, HEAD."
          }
        }
      }
    },
    "/api/v1/books/excerpts/random": {
      "get": {
        "operationId": "randomExcerpt",
        "summary": "Get complete prose paragraphs from a random book",
        "description": "Tries at most eight shuffled installed matching Text records, scanning at most 8 MiB per book. Requires Gutenberg START/END markers. Heuristically rejects front matter/headings; requires at least 12 whitespace-separated words, punctuation and predominantly lowercase letters per paragraph. Does not cross rejected paragraphs. Chooses uniformly among eligible paragraph windows within a successful book, not globally across the corpus. May reject dialogue, poetry and uncased scripts; may retain unusual prose-like front matter. Lines/paragraphs over 64 KiB are rejected. Never modifies raw downloads.",
        "parameters": [
          {
            "$ref": "#/components/parameters/language"
          },
          {
            "$ref": "#/components/parameters/year_from"
          },
          {
            "$ref": "#/components/parameters/year_to"
          },
          {
            "name": "paragraphs",
            "in": "query",
            "schema": {
              "type": "integer",
              "default": 3,
              "minimum": 1,
              "maximum": 10
            },
            "description": "Exact paragraph count, not a word count."
          }
        ],
        "responses": {
          "200": {
            "description": "Excerpt with source metadata (book has no available field).",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Excerpt"
                }
              }
            },
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/Invalid"
          },
          "404": {
            "$ref": "#/components/responses/Missing"
          },
          "405": {
            "$ref": "#/components/responses/Method"
          },
          "422": {
            "$ref": "#/components/responses/NoExcerpt"
          }
        }
      },
      "head": {
        "operationId": "randomExcerptHead",
        "summary": "Get complete prose paragraphs from a random book (headers only)",
        "description": "Same selection/validation as GET; no response body. Tries at most eight shuffled installed matching Text records, scanning at most 8 MiB per book. Requires Gutenberg START/END markers. Heuristically rejects front matter/headings; requires at least 12 whitespace-separated words, punctuation and predominantly lowercase letters per paragraph. Does not cross rejected paragraphs. Chooses uniformly among eligible paragraph windows within a successful book, not globally across the corpus. May reject dialogue, poetry and uncased scripts; may retain unusual prose-like front matter. Lines/paragraphs over 64 KiB are rejected. Never modifies raw downloads.",
        "parameters": [
          {
            "$ref": "#/components/parameters/language"
          },
          {
            "$ref": "#/components/parameters/year_from"
          },
          {
            "$ref": "#/components/parameters/year_to"
          },
          {
            "name": "paragraphs",
            "in": "query",
            "schema": {
              "type": "integer",
              "default": 3,
              "minimum": 1,
              "maximum": 10
            },
            "description": "Exact paragraph count, not a word count."
          }
        ],
        "responses": {
          "200": {
            "description": "Excerpt with source metadata (book has no available field).",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "const": "no-store"
                }
              }
            }
          },
          "400": {
            "description": "400 invalid_query: invalid, unknown or repeated selection parameter; invalid range."
          },
          "404": {
            "description": "404: book_not_found for unknown IDs; text_unavailable for absent text; no_matching_books for empty random selection; not_found for unknown API routes."
          },
          "405": {
            "description": "405 method_not_allowed. Allow: GET, HEAD."
          },
          "422": {
            "description": "422 no_suitable_excerpt: the bounded random sample did not yield enough qualifying paragraphs. Does not mean the whole corpus lacks prose."
          }
        }
      }
    },
    "/api/v1/lyrics": {
      "get": {
        "operationId": "listLyrics",
        "summary": "Browse and search songs",
        "description": "Without q, ascending id order. With q, runs SQLite FTS5 full-text search over title, artist and lyrics body (each whitespace-separated word required, as a quoted term) and orders by relevance: title matches outweigh artist matches, which outweigh body matches, with view count breaking ties. Optional field=title|artist scopes q to a single column. Optional language, tag and view-count (views_from/views_to) filters. Song lyrics bodies are omitted from listings. Empty results return 200. Numeric offset cursors are not snapshots.",
        "parameters": [
          {"$ref": "#/components/parameters/songLanguage"},
          {"$ref": "#/components/parameters/tag"},
          {"$ref": "#/components/parameters/views_from"},
          {"$ref": "#/components/parameters/views_to"},
          {"name": "q", "in": "query", "schema": {"type": "string"}, "description": "Full-text query; maximum 256 UTF-8 bytes.", "example": "concrete jungle"},
          {"name": "field", "in": "query", "schema": {"type": "string", "enum": ["title", "artist"]}, "description": "Scope q to a single column. Omit to search title, artist and lyrics body together."},
          {"name": "limit", "in": "query", "schema": {"type": "integer", "default": 25, "minimum": 1, "maximum": 100}},
          {"name": "cursor", "in": "query", "schema": {"type": "string", "pattern": "^[0-9]+$"}, "description": "Nonnegative offset returned as next_cursor. Omit for first page."}
        ],
        "responses": {
          "200": {"description": "Matching songs without lyrics bodies.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SongPage"}}}},
          "400": {"$ref": "#/components/responses/Invalid"},
          "404": {"$ref": "#/components/responses/LyricsMissing"},
          "405": {"$ref": "#/components/responses/Method"},
          "500": {"$ref": "#/components/responses/LyricsError"}
        }
      },
      "head": {
        "operationId": "listLyricsHead",
        "summary": "Browse and search songs (headers only)",
        "description": "Same selection/validation as GET; no response body.",
        "parameters": [
          {"$ref": "#/components/parameters/songLanguage"},
          {"$ref": "#/components/parameters/tag"},
          {"$ref": "#/components/parameters/views_from"},
          {"$ref": "#/components/parameters/views_to"},
          {"name": "q", "in": "query", "schema": {"type": "string"}, "description": "Full-text query; maximum 256 UTF-8 bytes."},
          {"name": "field", "in": "query", "schema": {"type": "string", "enum": ["title", "artist"]}, "description": "Scope q to a single column. Omit to search title, artist and lyrics body together."},
          {"name": "limit", "in": "query", "schema": {"type": "integer", "default": 25, "minimum": 1, "maximum": 100}},
          {"name": "cursor", "in": "query", "schema": {"type": "string", "pattern": "^[0-9]+$"}}
        ],
        "responses": {
          "200": {"description": "Matching songs without lyrics bodies."},
          "400": {"description": "400 invalid_query: invalid, unknown or repeated selection parameter."},
          "404": {"description": "404 lyrics_unavailable: no lyrics corpus installed."},
          "405": {"description": "405 method_not_allowed. Allow: GET, HEAD."},
          "500": {"description": "500 lyrics_error: the lyrics database could not be queried."}
        }
      }
    },
    "/api/v1/lyrics/{id}": {
      "get": {
        "operationId": "getSong",
        "summary": "Get song metadata",
        "description": "Retrieves one song by id. Lyrics body is not included; use the text endpoint.",
        "parameters": [{"$ref": "#/components/parameters/songId"}],
        "responses": {
          "200": {"description": "Song record without lyrics body.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Song"}}}},
          "404": {"$ref": "#/components/responses/LyricsMissing"},
          "405": {"$ref": "#/components/responses/Method"},
          "500": {"$ref": "#/components/responses/LyricsError"}
        }
      },
      "head": {
        "operationId": "getSongHead",
        "summary": "Get song metadata (headers only)",
        "description": "Same selection/validation as GET; no response body.",
        "parameters": [{"$ref": "#/components/parameters/songId"}],
        "responses": {
          "200": {"description": "Song record without lyrics body."},
          "404": {"description": "404 song_not_found for unknown ids; lyrics_unavailable when no corpus is installed."},
          "405": {"description": "405 method_not_allowed. Allow: GET, HEAD."},
          "500": {"description": "500 lyrics_error: the lyrics database could not be queried."}
        }
      }
    },
    "/api/v1/lyrics/{id}/text": {
      "get": {
        "operationId": "getSongText",
        "summary": "Get a song's lyrics",
        "description": "UTF-8 plain text lyrics body as stored, including section markers such as [Chorus]. Unlike book text, no byte-range or conditional-request support.",
        "parameters": [{"$ref": "#/components/parameters/songId"}],
        "responses": {
          "200": {"description": "Lyrics body.", "content": {"text/plain": {"schema": {"type": "string"}}}},
          "404": {"$ref": "#/components/responses/LyricsMissing"},
          "405": {"$ref": "#/components/responses/Method"},
          "500": {"$ref": "#/components/responses/LyricsError"}
        }
      },
      "head": {
        "operationId": "getSongTextHead",
        "summary": "Get a song's lyrics (headers only)",
        "description": "Same selection/validation as GET; no response body. Content-Length reflects the lyrics byte length.",
        "parameters": [{"$ref": "#/components/parameters/songId"}],
        "responses": {
          "200": {"description": "Lyrics body headers."},
          "404": {"description": "404 song_not_found for unknown ids; lyrics_unavailable when no corpus is installed."},
          "405": {"description": "405 method_not_allowed. Allow: GET, HEAD."},
          "500": {"description": "500 lyrics_error: the lyrics database could not be queried."}
        }
      }
    },
    "/api/v1/lyrics/random": {
      "get": {
        "operationId": "randomSong",
        "summary": "Pick a random song",
        "description": "Random over songs matching the optional language, tag and view-count filters, independent of storage order (indexed random bucket, not a full scan). Returns metadata without the lyrics body. Repeats are allowed.",
        "parameters": [
          {"$ref": "#/components/parameters/songLanguage"},
          {"$ref": "#/components/parameters/tag"},
          {"$ref": "#/components/parameters/views_from"},
          {"$ref": "#/components/parameters/views_to"}
        ],
        "responses": {
          "200": {"description": "Chosen song without lyrics body.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Song"}}}, "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}},
          "400": {"$ref": "#/components/responses/Invalid"},
          "404": {"$ref": "#/components/responses/LyricsMissing"},
          "405": {"$ref": "#/components/responses/Method"},
          "500": {"$ref": "#/components/responses/LyricsError"}
        }
      },
      "head": {
        "operationId": "randomSongHead",
        "summary": "Pick a random song (headers only)",
        "description": "Same selection/validation as GET; no response body.",
        "parameters": [
          {"$ref": "#/components/parameters/songLanguage"},
          {"$ref": "#/components/parameters/tag"},
          {"$ref": "#/components/parameters/views_from"},
          {"$ref": "#/components/parameters/views_to"}
        ],
        "responses": {
          "200": {"description": "Chosen song without lyrics body.", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}},
          "400": {"description": "400 invalid_query: invalid, unknown or repeated selection parameter."},
          "404": {"description": "404 no_matching_songs when no song matches; lyrics_unavailable when no corpus is installed."},
          "405": {"description": "405 method_not_allowed. Allow: GET, HEAD."},
          "500": {"description": "500 lyrics_error: the lyrics database could not be queried."}
        }
      }
    },
    "/api/v1/lyrics/excerpts/random": {
      "get": {
        "operationId": "randomStanza",
        "summary": "Get a random stanza from a random song",
        "description": "Tries up to eight random matching songs (honouring the optional language, tag and view-count filters). A stanza is a run of consecutive non-blank lines between blank lines; lines that are bracketed section markers such as [Chorus] are dropped, and a stanza must have at least two lines. Chooses uniformly among eligible stanzas within a song. Returns the source song (without its full lyrics body) and the stanza lines.",
        "parameters": [
          {"$ref": "#/components/parameters/songLanguage"},
          {"$ref": "#/components/parameters/tag"},
          {"$ref": "#/components/parameters/views_from"},
          {"$ref": "#/components/parameters/views_to"}
        ],
        "responses": {
          "200": {"description": "Stanza with source song metadata.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/LyricsExcerpt"}}}, "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}},
          "400": {"$ref": "#/components/responses/Invalid"},
          "404": {"$ref": "#/components/responses/LyricsMissing"},
          "405": {"$ref": "#/components/responses/Method"},
          "422": {"$ref": "#/components/responses/NoStanza"},
          "500": {"$ref": "#/components/responses/LyricsError"}
        }
      },
      "head": {
        "operationId": "randomStanzaHead",
        "summary": "Get a random stanza from a random song (headers only)",
        "description": "Same selection/validation as GET; no response body.",
        "parameters": [
          {"$ref": "#/components/parameters/songLanguage"},
          {"$ref": "#/components/parameters/tag"},
          {"$ref": "#/components/parameters/views_from"},
          {"$ref": "#/components/parameters/views_to"}
        ],
        "responses": {
          "200": {"description": "Stanza with source song metadata.", "headers": {"Cache-Control": {"schema": {"type": "string", "const": "no-store"}}}},
          "400": {"description": "400 invalid_query: invalid, unknown or repeated selection parameter."},
          "404": {"description": "404 no_matching_songs when no song matches; lyrics_unavailable when no corpus is installed."},
          "405": {"description": "405 method_not_allowed. Allow: GET, HEAD."},
          "422": {"description": "422 no_suitable_excerpt: the sampled songs yielded no qualifying stanza."},
          "500": {"description": "500 lyrics_error: the lyrics database could not be queried."}
        }
      }
    },
    "/api/v1/lyrics/tags": {
      "get": {
        "operationId": "listTags",
        "summary": "List genre tags",
        "description": "Sorted distinct genre tags present in the corpus.",
        "parameters": [],
        "responses": {
          "200": {"description": "Genre tags.", "content": {"application/json": {"schema": {"type": "object", "required": ["tags"], "properties": {"tags": {"type": "array", "items": {"type": "string"}, "example": ["pop", "rap"]}}}}}},
          "404": {"$ref": "#/components/responses/LyricsMissing"},
          "405": {"$ref": "#/components/responses/Method"},
          "500": {"$ref": "#/components/responses/LyricsError"}
        }
      },
      "head": {
        "operationId": "listTagsHead",
        "summary": "List genre tags (headers only)",
        "description": "Same selection/validation as GET; no response body.",
        "parameters": [],
        "responses": {
          "200": {"description": "Genre tags."},
          "404": {"description": "404 lyrics_unavailable: no lyrics corpus installed."},
          "405": {"description": "405 method_not_allowed. Allow: GET, HEAD."},
          "500": {"description": "500 lyrics_error: the lyrics database could not be queried."}
        }
