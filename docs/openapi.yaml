    },
    "/api/v1/lyrics/languages": {
      "get": {
        "operationId": "listSongLanguages",
        "summary": "List song languages",
        "description": "Sorted distinct language codes present in the corpus.",
        "parameters": [],
        "responses": {
          "200": {"description": "Language codes.", "content": {"application/json": {"schema": {"type": "object", "required": ["languages"], "properties": {"languages": {"type": "array", "items": {"type": "string"}, "example": ["en", "fr"]}}}}}},
          "404": {"$ref": "#/components/responses/LyricsMissing"},
          "405": {"$ref": "#/components/responses/Method"},
          "500": {"$ref": "#/components/responses/LyricsError"}
